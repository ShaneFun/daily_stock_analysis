name: Keep Alive

# Prevent GitHub from auto-disabling scheduled workflows
# after 60 days of repository inactivity.

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month at UTC 00:00

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep alive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep alive [skip ci]"
          git push
